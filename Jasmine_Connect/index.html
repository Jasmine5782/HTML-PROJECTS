<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasmine Connect</title>
    <link rel="stylesheet" href="styles.css">    
</head>
<body>

    <header>
        <h1>Jasmine Connect</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Messages</a>
        <a href="#">Notifications</a>
    </nav>

    <main>
        <section>
            <h2>Welcome to JasmineConnect</h2>
            <p>Connect with people and share your thoughts.</p>
        </section>

        <section>
            <h2>Create a post</h2>

            <textarea placeholder="What is on your mind?"></textarea>

            <button>Post</button>
        </section>

        <section>
            <h2>Latest Post</h2>

            <article>
                <h3>Jasmine</h3>
                <p>Welcome to the beginning of my journey as a content creator</p>
                <button>Like</button>
                <button>Comment</button> 
            </article>
        </section>
    </main>
</body>
</html>
